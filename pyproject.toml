[project]
name = "dubonline-aicoding"
version = "0.1.0"
description = "Personal AI coding and code review agent maintained by dubonline"
requires-python = ">=3.14"
dependencies = [
  "deepagents>=0.6.11",
  "fastapi>=0.138.0",
  "uvicorn>=0.49.0",
  "langchain-openai>=1.3.2",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "python-dotenv>=1.2.2",
  "requests>=2.32.0",
  "zhipuai>=2.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
